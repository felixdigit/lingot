# LiteLLM gateway config for the harness (Phase 4).
#
# Self-hosted, local by default. Translates the OpenAI-only providers (xAI Grok,
# RunPod vLLM) into the Anthropic-format the loop anchor (Claude Code) speaks, so
# `harness run --tier <alias>` can point ANTHROPIC_BASE_URL at this gateway.
#
# Holds NO secrets -- every key is read from the machine-local environment
# (os.environ/...). Run it (once XAI_API_KEY etc. are set in .env):
#
#   litellm --config engine/lingot/gateway/litellm.config.yaml --port 4000
#
# Then the harness reaches it at LITELLM_BASE_URL (default http://localhost:4000)
# with LITELLM_MASTER_KEY. model_name values below MUST match the tier registry's
# `model` field (engine/lingot/src/harness-kernel.ts) so the shim's ANTHROPIC_MODEL
# routes correctly.

model_list:
  # xAI Grok -- the `fast-cheap` tier. Ready the moment XAI_API_KEY is set.
  - model_name: grok-4.1-fast
    litellm_params:
      model: xai/grok-4.1-fast
      api_key: os.environ/XAI_API_KEY

  # xAI Grok -- the `frontier-alt` tier (newest).
  - model_name: grok-4.5
    litellm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY

  # RunPod vLLM -- the `beast` burst tier. Finalize once the serverless endpoint
  # exists: set the model_name to match the registry, api_base to the endpoint's
  # OpenAI URL (e.g. https://api.runpod.ai/v2/<endpoint-id>/openai/v1), and pick
  # the open-weight model id you deployed. Left commented until provisioned.
  # - model_name: beast-vllm
  #   litellm_params:
  #     model: openai/<deployed-model-id>
  #     api_base: os.environ/RUNPOD_VLLM_ENDPOINT
  #     api_key: os.environ/RUNPOD_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
